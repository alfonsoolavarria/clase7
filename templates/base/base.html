<!DOCTYPE html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              error: "#ba1a1a",
              "primary-container": "#4338ca",
              "outline-variant": "#c7c4d7",
              "on-background": "#131b2e",
              "surface-container-high": "#e2e7ff",
              "on-primary-container": "#c1beff",
              "secondary-fixed-dim": "#ffb5a1",
              "on-secondary-fixed-variant": "#7e2b15",
              "surface-bright": "#faf8ff",
              "on-surface": "#131b2e",
              "on-error-container": "#93000a",
              tertiary: "#68260f",
              outline: "#777586",
              "surface-container-lowest": "#ffffff",
              "error-container": "#ffdad6",
              "secondary-fixed": "#ffdbd1",
              "surface-container": "#eaedff",
              "secondary-container": "#fd8c6e",
              background: "#faf8ff",
              "surface-container-low": "#f2f3ff",
              primary: "#2a14b4",
              "inverse-primary": "#c3c0ff",
              "on-secondary": "#ffffff",
              "on-tertiary-fixed-variant": "#77311a",
              "on-error": "#ffffff",
              "tertiary-fixed": "#ffdbd0",
              "tertiary-container": "#853c23",
              "surface-variant": "#dae2fd",
              "on-secondary-container": "#74240e",
              "on-primary-fixed-variant": "#372abf",
              "surface-dim": "#d2d9f4",
              "inverse-on-surface": "#eef0ff",
              "inverse-surface": "#283044",
              secondary: "#9d422a",
              "primary-fixed": "#e3dfff",
              "on-primary-fixed": "#100069",
              "on-primary": "#ffffff",
              "surface-container-highest": "#dae2fd",
              "tertiary-fixed-dim": "#ffb59e",
              surface: "#faf8ff",
              "on-surface-variant": "#464554",
              "primary-fixed-dim": "#c3c0ff",
              "on-tertiary-container": "#ffb39b",
              "on-tertiary-fixed": "#3a0b00",
              "surface-tint": "#5148d7",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed": "#3c0800",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "space-lg": "2rem",
              "space-md": "1.25rem",
              "space-sm": "0.75rem",
              "gutter-mobile": "1rem",
              "space-xs": "0.375rem",
              margin: "3rem",
              "gutter-tablet": "1.25rem",
              gutter: "1.5rem",
              "margin-mobile": "1.25rem",
              "space-xl": "3.5rem",
              "margin-tablet": "2rem",
            },
            fontFamily: {
              "body-sm": ["Plus Jakarta Sans"],
              "label-md": ["Plus Jakarta Sans"],
              "title-lg": ["Plus Jakarta Sans"],
              "headline-md": ["Plus Jakarta Sans"],
              "display-hero-mobile": ["Plus Jakarta Sans"],

              "body-lg": ["Plus Jakarta Sans"],
              "title-md": ["Plus Jakarta Sans"],
              "headline-sm": ["Plus Jakarta Sans"],

              "label-sm": ["Plus Jakarta Sans"],

                  lineHeight: "20px",
                  letterSpacing: "0.01em",
                  fontWeight: "600",
                },
              ],
              "title-lg": [
                "20px",
                {
                  lineHeight: "28px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "headline-md": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.02em",
                  fontWeight: "600",
                },
              ],
              "display-hero-mobile": [
                "36px",
                {
                  lineHeight: "44px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "body-md": ["16px", { lineHeight: "26px", fontWeight: "400" }],
              "body-lg": ["18px", { lineHeight: "30px", fontWeight: "400" }],
              "title-md": ["18px", { lineHeight: "26px", fontWeight: "500" }],
              "headline-sm": [
                "24px",
                {
                  lineHeight: "32px",
                  letterSpacing: "-0.015em",

                "44px",
                {
                  lineHeight: "52px",
                  letterSpacing: "-0.025em",
                  fontWeight: "600",
                },
              ],
              "display-hero": [
                "60px",
                {
                  lineHeight: "68px",
                  letterSpacing: "-0.03em",
                  fontWeight: "700",
                },
              ],
              "label-sm": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.03em",
                  fontWeight: "600",
                },
              ],
              "headline-lg-mobile": [
                "30px",
                {
                  lineHeight: "38px",
                  letterSpacing: "-0.015em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-surface font-body-md text-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container"
  >
    <header
      class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"
    >
      <div
        class="h-20 max-w-[1200px] mx-auto px-gutter-mobile md:px-gutter-tablet lg:px-gutter flex items-center justify-between"
      >
        <a class="flex items-center gap-space-xs" data-path="inicio" href="#"
          ><span class="w-2.5 h-2.5 rounded-full bg-secondary"></span
          ><span
            class="font-title-lg text-title-lg text-on-surface font-semibold tracking-tight"
            >Hola &amp; Co.</span
          ></a
        >

        <div class="flex items-center gap-space-sm">
          <a
            class="inline-flex items-center justify-center px-space-md py-space-xs rounded-lg bg-primary-container text-on-primary font-label-md text-label-md hover:bg-primary transition-all duration-200 shadow-sm"
            data-path="comenzar"
            href="#"
            >Comenzar</a
          >
          <div
            class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"
          >
            <span class="material-symbols-outlined text-on-primary text-[18px]"
              >person</span
            >
          </div>
        </div>
      </div>
    </header>
    {% block content %} {% endblock %} {% include 'base/footer.html' %}
  </body>
</html>
